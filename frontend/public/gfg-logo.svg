<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="gfgGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00E676" />
      <stop offset="100%" stop-color="#1B5E20" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield Container -->
  <rect x="25" y="25" width="450" height="450" rx="90" fill="#0B0F17" stroke="#00E676" stroke-width="12" stroke-opacity="0.4"/>
  
  <!-- GFG Code Braces Symbol { } -->
  <g fill="none" stroke="url(#gfgGreenGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <!-- Left Brace { -->
    <path d="M 170 120 C 130 120 120 150 120 190 C 120 220 100 240 70 250 C 100 260 120 280 120 310 C 120 350 130 380 170 380" />
    
    <!-- Right Brace } -->
    <path d="M 330 120 C 370 120 380 150 380 190 C 380 220 400 240 430 250 C 400 260 380 280 380 310 C 380 350 370 380 330 380" />
  </g>
  
  <!-- Central GFG Bold Letters -->
  <text x="250" y="275" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="110" fill="#FFFFFF" text-anchor="middle" letter-spacing="-2">gfg</text>
  
  <!-- Accent Green Dot -->
  <circle cx="345" cy="275" r="16" fill="#00E676" />
</svg>
